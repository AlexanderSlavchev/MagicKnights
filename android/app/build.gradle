plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.magicknights.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.magicknights.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    sourceSets {
        main {
            // Уеб играта се пакетира директно като assets — без копиране на файлове
            assets.srcDirs += ['../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
